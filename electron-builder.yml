appId: dev.midad.reader
productName: Midad
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
# Ask AI runs out/cli/*.mjs with the system's node, which can't read inside an asar archive.
asar: false
icon: resources/icon.png
linux:
  target: AppImage
  category: Education
  executableName: midad
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null
